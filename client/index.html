<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64x64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ERP12 Plasiyer" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ERP12 Plasiyer" />
    <title>ERP12 Mobil Saha Satış</title>
    <script>
      (function () {
        window.__PLASIYER_BOOTED__ = false;

        window.__plasiyerHardReset = function () {
          try {
            var btn = document.getElementById('plasiyer-boot-reset-btn');
            if (btn) btn.textContent = 'Önbellek temizleniyor...';
          } catch (e) {}

          var tasks = [];
          try {
            if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations) {
              tasks.push(
                navigator.serviceWorker.getRegistrations().then(function (regs) {
                  return Promise.all(regs.map(function (r) { return r.unregister(); }));
                })
              );
            }
          } catch (e) {}

          try {
            if ('caches' in window && caches.keys) {
              tasks.push(
                caches.keys().then(function (keys) {
                  return Promise.all(keys.map(function (k) { return caches.delete(k); }));
                })
              );
            }
          } catch (e) {}

          Promise.all(tasks)
            .catch(function () {})
            .finally(function () {
              window.location.replace(window.location.pathname + '?v=' + Date.now());
            });
        };

        function triggerAutoHealOnce() {
          if (window.__PLASIYER_BOOTED__) return;
          try {
            if (sessionStorage.getItem('plasiyer_sw_healed') === '1') {
              var wrap = document.getElementById('plasiyer-boot-actions');
              if (wrap) wrap.style.display = 'block';
              return;
            }
            sessionStorage.setItem('plasiyer_sw_healed', '1');
          } catch (e) {}
          window.__plasiyerHardReset();
        }

        // Eski JS modülü 404 veya yanlış MIME tipi dönerse anında önbelleği onar
        window.addEventListener(
          'error',
          function (event) {
            var target = event && event.target;
            if (target && target.tagName === 'SCRIPT') {
              triggerAutoHealOnce();
            }
          },
          true
        );

        // 3.5 sn sonra manuel kurtarma butonunu görünür yap, 4.5 sn'de hala açılmadıysa otomatik onar
        setTimeout(function () {
          if (!window.__PLASIYER_BOOTED__) {
            var wrap = document.getElementById('plasiyer-boot-actions');
            if (wrap) wrap.style.display = 'block';
          }
        }, 3500);

        setTimeout(function () {
          if (!window.__PLASIYER_BOOTED__) {
            triggerAutoHealOnce();
          }
        }, 4500);
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased" style="margin:0;background-color:#020617;color:#f8fafc;">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;background:#020617;color:#f8fafc;">
        <div style="width:42px;height:42px;border:3.5px solid rgba(59,130,246,0.25);border-top-color:#3b82f6;border-radius:9999px;animation:plasiyerSpin 0.8s linear infinite;margin-bottom:16px;"></div>
        <div style="font-size:15px;font-weight:800;letter-spacing:0.2px;">ERP12 Mobil Plasiyer</div>
        <div style="font-size:12px;color:#94a3b8;margin-top:6px;">Uygulama hazırlanıyor...</div>
        <div id="plasiyer-boot-actions" style="display:none;margin-top:20px;">
          <button
            id="plasiyer-boot-reset-btn"
            type="button"
            onclick="window.__plasiyerHardReset && window.__plasiyerHardReset()"
            style="background:#2563eb;color:#ffffff;border:none;border-radius:12px;padding:10px 18px;font-size:12px;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(37,99,235,0.35);"
          >
            Önbelleği Yenile ve Aç
          </button>
        </div>
        <style>
          @keyframes plasiyerSpin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
